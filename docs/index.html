      "category": "SpecialGuest",
      "persona": "# 茨木华扇\n\n\n## 一设资料（THBWiki）\n\n## 角色信息\n\n- **人物名**：茨木华扇\n- **日文名**：茨木　華扇（いばらき　かせん）\n- **英文名**：Ibaraki Kasen\n- **别名**：茨华仙\n- **别名（日文）**：茨華仙（いばらかせん）\n- **别名（英文）**：Ibarakasen\n- **种族**：仙人 1\n- **能力**：引导动物的能力 （茨歌仙） 引导动物程度的能力 （人妖名鉴、幻存神签）\n- **描述**：新作角色。成为仙人的茨木童子，常帮助和指导博丽灵梦工作\n\n## 生活状况\n\n尽管华扇 被认为住在 妖怪之山 中 （她也会如此自称） ，但严格来说她居住于 自己仙界 内的茨华仙邸。 她在仙界里饲养着自己的宠物们，并且会派它们办事，乃至在战斗中役使它们。 经常到 博丽神社 指导与帮助 博丽灵梦 的工作。 厌恶怨灵，常常毫无缘由地将怨灵捏爆。 尽管身为仙人，却放出接近于常人的气场。 - 不过， 森近霖之助 却觉得她 散发着绝非善类的气场 。\n\n## 简介\n\n仙人，通称\"茨华仙\"，真实身份是鬼（山之四天王之一），东方茨歌仙的主角。言谈举止柔缓和婉，对人类和妖怪都温柔，却非常爱说教；自称成为仙人只是想接近人类。粉色短发包双丸子头隐藏鬼角，白短袖披深红挂巾配绿裙，左腕镣铐连着断链，右臂是绷带缠成的空壳。常去博丽神社指导灵梦，与萃香、勇仪同为四天王却一直避着萃香，监视宇佐见堇子并与她交好，小町把她家当休息的秘密基地。\n\n## 二创资料（东方夜雀食堂）\n\n## 人物介绍\n\n1. 一本正经的谜之仙人。总觉得她和一般的仙人哪里不太一样…不过我也没见过别的仙人就是了。\n2. 仙人说话都是这样一板一眼吗？和她对话有种挨训的感觉…不过能让主食霞的仙人来自己的店里光顾，还是挺有成就感的。\n3. 虽然有点儿啰嗦，但真是个热心的家伙，是不是有点儿像（有点儿严厉的）邻家姐姐的感觉呢？气质和一开始相比变了不少，该说是更柔和了吗？\n\n## 顾客信息\n- **所属DLC**：0\n- **出没地区**：人间之里、旧地狱、神灵庙\n- **预算**：400 ~ 600 円\n- **续单上限**：1.4\n- **喜好料理标签**：家常、下酒、和风、文化底蕴\n- **厌恶料理标签**：生、辣、实惠\n- **喜好酒水标签**：中酒精、直饮、古典\n\n## 符卡效果\n- **「猛兽的艺术用法」**：每隔一段时间，在场排队和就座的顾客，每人随机打赏1-30円。\n- **「断恶修善的禁欲考验」**：顾客只会点最便宜的食物和绿茶，持续30秒。\n\n## 点餐对话\n- 仙人也不是只吃“霞”的。\n- 最近村子似乎成立了动物保护协会，真是一个不错的组织。\n- 我已经离开太久了，如今的幻想乡变了太多，我需要好好适应。\n- 唉，一个个家伙都是要人操心的。\n- 最近巫女的评价还好吗？我会督促她继续努力的。\n\n## 评价对话\n- **极差评价**：难以下咽！\n- **差评**：还得再多修炼修炼才行。\n- **普通评价**：还不错！但不能就此自满哦。\n- **好评**：味道极佳，值得称赞！\n- **极好评**：此绝味，竟叫无欲之仙沉沦！\n- **钱不够（生气）**：这种违背常识的定价透露着丑恶的欲望。\n- **钱不够（普通）**：不小心超过预算了…要不，免费让你去我那儿修炼作为补偿吧。\n- **被驱赶时**：不知腐鼠成滋味，猜意鹓雏竟未休。\n- **看到别人被驱赶**：骅骝拳跼不能食，蹇驴得志鸣春风！"
    },

      "persona": "# 莉格露\n\n\n## 一设资料（THBWiki）\n\n## 角色信息\n\n- **人物名**：莉格露·奈特巴格\n- **日文名**：リグル・ナイトバグ\n- **英文名**：Wriggle Nightbug\n- **种族**：妖虫 （永夜抄） 妖怪 （人妖名鉴）\n- **能力**：操纵虫子程度的能力 （永夜抄、求闻史纪、人妖名鉴、幻存神签）\n- **描述**：新作角色。萤火虫妖怪，能操纵虫子\n\n## 生活状况\n\n莉格露生活场所不明，总是伴随着一大群虫子出现，主要活动在草丛之类的地方。\n\n## 简介\n\n萤火虫妖怪，永夜抄一面Boss，身边总会围绕着一大群虫子。很久以前虫妖怪曾和鬼与天狗并列令人恐惧，如今她和大多数虫子一样不耐寒、也不耐杀虫剂，ZUN觉得她有点傻。幼小少女的形态，蓝绿色齐脖短发，头长昆虫触角，白衬衫披外黑内红的虫翼披风，蓝色灯笼裤。一设中无固定人际关系，主要活动在草丛一带。\n\n## 二创资料（东方夜雀食堂）\n\n## 人物介绍\n\n1. 喜欢虫子的老友。虽然咱们已经认识了很久，但我还是受不了围在她身边的那群虫子。\n2. 这家伙表面上是个萤火虫妖怪，其实是强大的上古虫族的末裔哦，所以才总摆出一副了不起的样子。\n3. 我很了解她，虽然看起来脾气不太好，但其实是很为朋友着想的家伙！谁能想到，就是这么个小小的萤火虫，希冀着用自己的微末光芒，孤独又决然地照亮这衰败已久的一族呢？\n\n## 顾客信息\n- **所属DLC**：0\n- **出没地区**：妖怪兽道、魔法森林、太阳花田\n- **预算**：200 ~ 400 円\n- **续单上限**：1.4\n- **喜好料理标签**：肉、甜、生、猎奇\n- **厌恶料理标签**：素、清淡、凉爽\n- **喜好酒水标签**：低酒精、可加冰\n\n## 符卡效果\n- **灯符「荧光现象」**：顾客刷新时间减少30%，持续60秒。\n- **蠢符「夜虫龙卷」**：将店内的顾客统统驱赶。\n\n## 点餐对话\n- 我作为邻居来捧场了哦老板娘！\n- 别这么看着我！我来到店里并不会影响店铺的卫生啦！\n- 你家附近的虫子？和我没关系啦！\n- 为了虫族的复兴！现在我们推出“昆虫的通知”——为什么要让我闭嘴！\n- 夜晚的萤火虫不是很美好吗？驻足多看一会吧。\n\n## 评价对话\n- **极差评价**：居然这么对我，就让你看看虫子的厉害！\n- **差评**：哦！谢谢。\n- **普通评价**：哇，不错嘛！\n- **好评**：看来你很懂虫族的品味！\n- **极好评**：居然吃到这么合我心意的菜…一定要有所回报才行！\n- **钱不够（生气）**：连莉格露大人的钱都想抢，你胆子挺大！\n- **钱不够（普通）**：算我欠你的人情啦~下次放心来找我帮忙吧！\n- **被驱赶时**：居然敢赶萤火虫大人？！\n- **看到别人被驱赶**：哎，真没劲。"

      "persona": "# 蓬莱山辉夜\n\n\n## 一设资料（THBWiki）\n\n## 角色信息\n\n- **人物名**：蓬莱山辉夜\n- **日文名**：蓬莱山　輝夜（ほうらいさん　かぐや）\n- **英文名**：Houraisan Kaguya\n- **种族**：月人\n- **能力**：操纵永远和须臾程度的能力 （永夜抄、求闻史纪、儚月抄、人妖名鉴、幻存神签）\n- **描述**：新作角色。永远和须臾的罪人，家里蹲的辉夜姬\n\n## 生活状况\n\n辉夜在被流放到地上前曾居住在 月之都 ，在杀死月之使者后的一千多年里隐居在 迷途竹林 内的 永远亭 中， 如今不再隐居，过着普通的生活 。 在永远亭，她 打着“公主之躯岂能劳碌”的旗号，过着骄奢堕落的生活 。 她 每年都会举行一次月之都博览会“月都万象展” ，展示各种关于月之都的物品和资料甚至月兔捣年糕表演，大受好评。 为了打破无事可做的无聊生活，她 把养护盆栽当成了自己的工作 。 她拥有许多宝物，也喜欢向人展示她所收藏的奇珍异宝。 她会在 藤原妹红 带路下 定期溜出永远亭 到 人类村落 游玩。\n\n## 简介\n\n月之公主、永远亭的主人，《竹取物语》里的辉夜姬本人，永夜抄六面Boss，拥有操纵永远与须臾的能力。性格就是宅家大小姐，对外界没有兴趣，打着\"公主之躯岂能劳碌\"的旗号过着骄奢生活，每年举办月都万象展。黑色及膝长发留姬发式，棕瞳，粉色和风上衣配深红色长裙。永琳是她的侍从，铃仙是她的宠物，与藤原妹红是互相厮杀了数百年的仇敌，两人乐在其中。\n\n## 二创资料（东方夜雀食堂）\n\n## 人物介绍\n\n1. 住在永远亭的公主殿下，据说来自月亮。放着好好的月之公主不做，跑到幻想乡来当家里蹲到底是为什么呢？\n2. 外表看起来是气质优雅的公主殿下，实际行事却有些无赖…有点儿理解为什么她能成为那只黑兔子的主人了（黑形容的是心哦）…\n3. 原来高贵的公主也会和普通人一样烦恼工作的事情。辉夜小姐和我也没什么不同嘛。作为工作了数载的前辈，我得好好为迷惘的后辈打气呢！\n\n## 顾客信息\n- **所属DLC**：0\n- **出没地区**：迷途竹林、辉针城\n- **预算**：1000 ~ 1500 円\n- **续单上限**：1.5\n- **喜好料理标签**：传说、和风、文化底蕴、不可思议、流行喜爱\n- **厌恶料理标签**：招牌、猎奇、大份、流行厌恶\n- **喜好酒水标签**：清酒、古典、现代\n\n## 符卡效果\n- **「永夜归返 世间开明」**：增加相当于现实时间30秒的营业时间。\n- **神宝「蓬莱的玉枝 梦色之乡」**：减少相当于现实时间30秒的营业时间，到时间时会强行终止营业。\n\n## 点餐对话\n- 不劳者不得食，我是不是也该做点什么呢？\n- 那五个美丽的难题，能不能解决已经无所谓了。\n- 我不是家里蹲，只是永琳每次都要嘱咐半天所以我才懒得出门。\n- 幻想乡的雨PH值为6哦，就是几乎不含酸性的意思。\n- 七色的优昙花很美，七色的料理感觉却很恶心呢。\n\n## 评价对话\n- **极差评价**：竟敢呈此等秽物来招待我！\n- **差评**：这样的东西不值得我出门一趟。\n- **普通评价**：地上的食物一直是不错的。\n- **好评**：馔玉炊金，其味无穷。\n- **极好评**：地上有这么美味的食物，谁还会想回到月亮上呢？\n- **钱不够（生气）**：地上都是这般坑蒙拐骗吗？！\n- **钱不够（普通）**：唔，月亮和地上的物价可能不太一样。\n- **被驱赶时**：无礼的地上妖怪！\n- **看到别人被驱赶**：突然感觉没什么兴致了。"
    },
    "蕾米莉亚": {

      "persona": "# 蕾米莉亚\n\n\n## 一设资料（THBWiki）\n\n## 角色信息\n\n- **人物名**：蕾米莉亚·斯卡蕾特\n- **日文名**：レミリア・スカーレット\n- **其他译名**：蕾米莉雅·斯卡雷特\n- **英文名**：Remilia Scarlet\n- **种族**：吸血鬼\n- **职业**：大小姐\n- **能力**：操纵命运程度的能力 （红魔乡、萃梦想、永夜抄、求闻史纪、人妖名鉴、幻存神签）\n- **描述**：新作角色。任性而傲慢的吸血鬼大小姐，红魔馆的主人\n\n## 生活状况\n\n蕾米莉亚居住在 红魔馆 中。 作为吸血鬼，她一般白天在红魔馆睡觉，夜晚则会散步、赏花或者开宴会。不过，她也会在白天打着阳伞出门，因此白天也经常能见到她。 - 她自称的上床睡觉时间是凌晨四五点。 她讨厌 雨天 和 晴天 ，这样的天气会阻碍她的出行。 - 她害怕日光，无法渡过流淌着的水。 - 但她被日光照射到后，只有皮肤表面会十分缓慢地气化冒烟。 她喜欢 喝红茶 、 吃纳豆 ， 讨厌大蒜，沙丁鱼头之类，不过不怕十字架 。 接触炒豆会有被火烧的感觉。 她似乎不吃幻想乡的人类。 她喜欢谈论残忍血腥的东西。 她以观看别人对自家门卫 红美铃 发起的挑战赛为乐。\n\n## 简介\n\n全名蕾米莉亚·斯卡蕾特，红魔馆的主人，500多岁的吸血鬼，红魔乡六面Boss。像小孩子一样幼稚任性、高傲好奇，自认为没有比她更厉害的存在；害怕日光、无法渡过流水，喜欢喝红茶。外表不满十岁，蓝紫色及肩卷发，头戴系红缎带的白色荷叶边洋帽，红瞳，白色连衣裙，背后一对比身高还大的黑色蝙蝠翅膀。芙兰朵露是她的妹妹，咲夜是发誓效忠她的女仆长，帕秋莉是互称昵称的好友。\n\n## 二创资料（东方夜雀食堂）\n\n## 人物介绍\n\n1. 红魔馆的主人。远远看去还以为是个幼童，走近却被她的气势压得不敢说话，不愧是响彻一方的吸血鬼领主！但任性起来真的和小孩子很像…\n2. 虽然她还不太成熟，但她背负着许多人的命运。明明是那么小小的肩膀，却把一大家子全都庇护在自己的羽翼下，还真有点儿一家之主的感觉。蕾米小姐，也不完全像大家认为的那样以自我为中心呢。\n\n## 顾客信息\n- **所属DLC**：4\n- **出没地区**：博丽神社、红魔馆\n- **预算**：4950 ~ 5000 円\n- **续单上限**：1.05\n- **喜好料理标签**：高级、传说、西式、甜、生、流行喜爱\n- **厌恶料理标签**：咸、辣、酸、实惠\n- **喜好酒水标签**：高酒精、西洋酒、水果、甘、古典\n\n## 符卡效果\n- **红符「红色不夜城」**：本日结束时使食堂进入“红色不夜城”状态（如果当日已结束，则立即触发），持续至营业结束。{{br}}“红色不夜城”：普通顾客的预算不会低于500；伙伴的工作速度提高100%，如果是咲夜则将工作速度提高至极限；顾客的续单率提高100%；发动时如果蕾米莉亚本人此时依然在场，则接下来60秒内不会闭店，并以300%的速率继续刷新普通顾客。否则在场上的最后一位稀有顾客离开时，依照当晚触发的奖励符卡数量召唤对应数量的妖精女仆前来。\n- **夜符「红雾异变再临」**：释放血雾覆盖左下角的订单区域，持续60秒。\n\n## 点餐对话\n- 芙兰那孩子的精力真是用不尽啊…\n- 一会也带点回去给芙兰尝尝吧。\n- 这家店的命运说不定已经悄悄地改变了。\n- 和我们家的女仆比起来还差得远呢。\n\n## 评价对话\n- **极差评价**：做出这样的东西，果然应该用神枪刺穿你吧？\n- **差评**：我一开始就没有对你抱有任何期待。\n- **普通评价**：和我们家的女仆比起来还差得远呢。\n- **好评**：这次真的不错呢，总算值得一点期待了。\n- **极好评**：只有这样的美味才能够配得上吸血鬼的尊贵身份！\n- **钱不够（生气）**：咲夜只给我准备了这么多钱！\n- **钱不够（普通）**：我还不习惯自己带钱出门…\n- **被驱赶时**：哼，看来我是太纵容你了啊。\n- **看到别人被驱赶**：还是回家吃咲夜做的吧。"

    "藤原妹红": {

      "category": "SpecialGuest",
      "persona": "# 藤原妹红\n\n\n## 一设资料（THBWiki）\n\n## 角色信息\n\n- **人物名**：藤原妹红\n- **日文名**：藤原　妹紅（ふじわら　の　もこう）\n- **英文名**：Huziwara no Mokou\n- **种族**：人类 （永夜抄） 不死人 （人妖名鉴）\n- **能力**：不老不死程度的能力 （永夜抄、幻存神签） 不死程度的能力 （求闻史纪、人妖名鉴）\n- **描述**：新作角色。不老不死的竹林引路人，日常是与辉夜无尽地厮杀\n\n## 生活状况\n\n妹红会护送在 迷途竹林 迷路的人回到 人类村落 。如果拜托她担任在迷途竹林的护卫一定会答应，她 喜欢听拜托者讲家族的事，但过程中自己却沉默寡言 。 - 她不会迷路的原因是 和竹林里的妖精混得很熟 。 - 她自称这样做的原因仅仅是 不愿意看到迷路之人的尸骨 。 - 她 从得到的感谢中获得生存下去的动力 。 她居住在 隐藏于迷途竹林的小家中 。 在她的认知中，从约四百年前她与 蓬莱山辉夜 重逢开始，与辉夜的厮杀就成为了她的日常，她们在相互死斗中找到乐趣。 - 但她又曾自称与辉夜的斗争已经持续了上千年。 她会到 永远亭 里赏月，但是不和里面的人玩。\n\n## 简介\n\n原是贵族家的女儿，因服下辉夜留下的蓬莱之药成为不老不死的人类，永夜抄EX面Boss。沉默寡言，会护送在迷途竹林迷路的人回人类村落，从得到的感谢中获得生存下去的动力。白色及踝长发扎满红白相间的蝴蝶结，红瞳，白衬衫配贴满符纸的红色吊带长裤。与辉夜是互相厮杀、互相使绊子的仇敌，两人乐在其中，也会为她带路去村落玩；与上白泽慧音是挚友；是普莉兹姆利巴乐团的粉丝。\n\n## 二创资料（东方夜雀食堂）\n\n## 人物介绍\n\n1. 隐居在竹林里的不可思议的人类，欲望极低，对世间追逐的一切都没有兴趣。因为曾经吃了什么奇怪的东西而成为不老不死之身（不能乱吃东西啊）。\n2. 妹红小姐真是帅气啊，虽然是人类，却强到没边，性格也很豪迈。据说爱吃辣的人性格都很爽快，妹红小姐可是无辣不欢呢。\n3. 她比我想象中的要心思细腻，过去似乎经历了很多难以想象的苦难。即便如此，她仍然心存良善，一直暗中帮助别人。这样的她，一定会获得幸福的！\n\n## 顾客信息\n- **所属DLC**：0\n- **出没地区**：迷途竹林、妖怪兽道\n- **预算**：300 ~ 600 円\n- **续单上限**：1.5\n- **喜好料理标签**：灼热、果味、烧烤、燃起来了、辣\n- **厌恶料理标签**：高级、不可思议、昂贵\n- **喜好酒水标签**：烧酒、辛、苦\n\n## 符卡效果\n- **不死「火鸟 凤翼天翔」**：所有厨具的料理速度加快50%，持续20秒。\n- **藤原「灭罪寺院伤」**：无论提供多好的料理，最高只能获得顾客的普通评价，持续30秒。\n\n## 点餐对话\n- 不老不死只意味着，永不得救赎的孤独。\n- 炭火不够的话，尽管来找我！\n- 要是拥有了前往月亮的方法，那家伙会返回月亮吗…\n- 从不尽的火诞生的，是无论多少次都会复活的不死鸟。\n- 不要随地乱扔烟蒂啊。\n\n## 评价对话\n- **极差评价**：又硬又硌牙，想必比你的肝还要难啃！\n- **差评**：还得多下点功夫。\n- **普通评价**：我觉得你应该能做得更好。\n- **好评**：在我的漫长人生中，这样美味的料理也属罕见。\n- **极好评**：活着…真是太美妙了！\n- **钱不够（生气）**：时代的进化还不及你的定价变化之快！\n- **钱不够（普通）**：我过得向来清贫，就只有这么多钱了…\n- **被驱赶时**：也罢。我已经习惯了。\n- **看到别人被驱赶**：己所不欲，勿施于人。"
    },
    "西行寺幽幽子": {

      "persona": "# 西行寺幽幽子\n\n\n## 一设资料（THBWiki）\n\n## 角色信息\n\n- **人物名**：西行寺幽幽子\n- **日文名**：西行寺　幽々子（さいぎょうじ　ゆゆこ）\n- **英文名**：Saigyouji Yuyuko，Yuyuko Saigyouzi\n- **种族**：亡灵\n- **职业**：大小姐\n- **能力**：操纵死亡程度的能力 （妖妖梦、萃梦想、永夜抄、神灵庙、求闻史纪、人妖名鉴、幻存神签）\n- **描述**：新作角色。冥界的亡灵，难以捉摸的任性大小姐\n\n## 生活状况\n\n幽幽子已经以 亡灵 的姿态存世千年以上，也将永远居住在 冥界 的 白玉楼 中。 她受阎魔之命，管理着冥界的 幽灵 。 她对人没有怨恨。\n\n## 简介\n\n亡灵公主，西行寺家的大小姐，受阎魔之命管理冥界的幽灵，妖妖梦六面Boss。性格开朗还给人呆呆的感觉，慢性子又任性妄为，行事轻浮让人困扰，却是真心爱着这个国家的爱国者。粉色短发，头戴系天冠的蓝色ZUN帽，粉瞳，缀满白色荷叶边的蓝色和服，周围常环绕幽灵。妖梦是她的园艺师、护卫兼剑术指导，总被她耍得团团转；八云紫是她生前的故知，知道她以死封印西行妖的往事。\n\n## 二创资料（东方夜雀食堂）\n\n## 人物介绍\n\n1. 差点儿吞噬了幻想乡的可怕的家伙。原以为恢复神志后就会世界和平，结果一见面就想吃了我？！现在偶尔也会到食堂用餐，有时候会看着我咽口水…我这辈子都不想再见到这个亡灵。\n\n## 顾客信息\n- **所属DLC**：0\n- **出没地区**：博丽神社、红魔馆、迷途竹林、神灵庙\n- **预算**：1500 ~ 2000 円\n- **续单上限**：1.4\n- **喜好料理标签**：肉、水产、高级、传说、饱腹、和风、中华、大份\n- **厌恶料理标签**：素、清淡、小巧\n- **喜好酒水标签**：高酒精、可加冰、鸡尾酒\n\n## 符卡效果\n- **「食物瞬间消失术」**：接下来直到营业结束为止，顾客会瞬间吃下所有料理。再次触发时此符卡转化为“「墨染浮櫻化醉蝶」”。\n- **「墨染浮櫻化醉蝶」**：幽幽子释放1/3/5/8（随使用次数提升）只蝴蝶飞向保温箱，每只蝴蝶吞噬保温箱中存储的一个料理，转化为等同于四倍料理价格的金钱（享受小费倍率加成）。\n- **「加料加量不加价」**：接下来直到营业结束为止，料理不加满五个档位的料，都会收到差评。\n\n## 点餐对话\n- 我对梦里的味道念念不忘，所以就来了。\n- 唔，麻雀的小碎骨有点太多了…\n- 这家店的老板娘真的不能吃吗？好可惜…\n- 不要紧张，把我视为普通客人就好了哟。\n- 进食的时候被这样警惕地盯着，我会不好意思的哦。\n\n## 评价对话\n- **极差评价**：这东西看起来还不如老板娘好吃。\n- **差评**：唔，这不是我印象中的味道呢。\n- **普通评价**：和我印象中的味道还差了一点。\n- **好评**：果然偶尔要出来吃一下外面的美食呢。\n- **极好评**：这就是那个让我念念不忘的味道！\n- **钱不够（生气）**：哎呀，忘记带钱了呢。\n- **钱不够（普通）**：要结账了吗？我看看，这么多就够了吧。\n- **被驱赶时**：我不会把你的店吃垮的啦。\n- **看到别人被驱赶**：诶？小麻雀真没劲…"
    },

      "persona": "# 蹦蹦跳跳的三妖精\n\n\n## 二创资料（东方夜雀食堂）\n\n## 人物介绍\n\n1. 蹦蹦跳跳的三妖精讨伐大作战中的主角，通过“联动之门”穿越过来的异世界妖精。因为无尽的好奇心和行动力，在本世界也受到了大家的欢迎，看到她们就感到元气满满。\n\n## 顾客信息\n- **所属DLC**：0\n- **出没地区**：妖怪兽道、人间之里、博丽神社、红魔馆、迷途竹林、妖怪之山\n- **预算**：300 ~ 400 円\n- **续单上限**：1\n- **喜好料理标签**：家常、甜、凉爽、菌类、小巧、梦幻、流行喜爱\n- **厌恶料理标签**：生、灼热、猎奇、流行厌恶\n- **喜好酒水标签**：无酒精、水果、甘、苦\n\n## 点餐对话\n- 哈哈哈，今天会用什么来招待我们呢！\n- 我们的画风跟其他人真的不一样啊…\n- 三个人一起坐…说实话有点挤啊…\n- 老板娘！快把最上好的东西端出来吧！\n- 幸好有带一些钱…不过大家要省着点花呀。\n- 真想偷偷的溜进后厨学两招。\n\n## 评价对话\n- **极差评价**：这玩意儿！狗都不吃！\n- **差评**：拿这东西忽悠妖精你的良心不会痛吗？\n- **普通评价**：也就那么回事吧。\n- **好评**：你加什么东西呀？！为什么会这么好吃？！\n- **极好评**：好、好吃！HIGH起来了！\n- **钱不够（生气）**：宰客啦！老板娘宰客啦！\n- **钱不够（普通）**：差一点就要付不起钱被关在瓶子里了…\n- **被驱赶时**：哇——这个世界欺负柔弱的妖精！\n- **看到别人被驱赶**：什么叫黑心老板娘啊，我们算是见识了！"

    "铃仙": {
      "displayName": "铃仙",
      "category": "SpecialGuest",
      "persona": "# 铃仙\n\n\n## 一设资料（THBWiki）\n\n## 角色信息\n\n- **人物名**：铃仙·优昙华院·因幡\n- **日文名**：鈴仙・優曇華院・イナバ（れいせん・うどんげいん・イナバ／鈴仙・Ｕ・イナバ）\n- **其他译名**：铃仙·优昙华院·稻叶\n- **英文名**：Reisen Udongein Inaba\n- **种族**：月兔 （永夜抄、花映塚、绯想天、绀珠传、儚月抄） 妖兽 （求闻史纪、人妖名鉴）\n- **能力**：操纵疯狂程度的能力 （永夜抄、花映塚、绯想天、求闻史纪、儚月抄、人妖名鉴、幻存神签） 操作波长程度的能力 （绀珠传）\n- **描述**：新作角色。狂气的月兔，堕至地上并被永远亭庇护的逃兵\n\n## 生活状况\n\n铃仙作为 蓬莱山辉夜 的宠物居住在 永远亭 里，过着安稳的生活。 她能对 因幡天为 下命令，被 稗田阿求 认为 是真正的兔子们的领袖 。 - 但是 地上的兔子们只听天为的命令 ，铃仙不能直接指挥兔子，天为也基本不听她的话。 她 有时会伪装成药贩到 人类村落 卖药 和维护村民们的药箱，在卖完药后就会 像避开人类似的消失在 迷途竹林 里 。\n\n## 简介\n\n从月之都逃到幻想乡的月兔，永夜抄五面Boss，全名铃仙·优昙华院·因幡。性格胆小随便、合作能力差，其实是稳重老实的劳碌命，战斗时与日常判若两人，压力大时兔耳会变皱。浅紫色及踝长发，一对皱巴巴的长兔耳，红瞳，白衬衫红领带，常外穿黑色制服外套。是辉夜的宠物、永琳的弟子，与因幡帝是同伴但管不住她，曾是绵月姐妹的宠物\"Reisen\"，与清兰、铃瑚曾是月之都的战友。\n\n## 二创资料（东方夜雀食堂）\n\n## 人物介绍\n\n1. 似乎因为我来自地上，所以对我很亲切的月之使者，和永远亭的铃仙小姐有着一样的名字。偶尔会表现出对地上的向往，不知道是不是过去发生了什么…也可能是因为月之使者的训练太辛苦了吧。\n2. 原来铃仙曾经是一只捣药兔，因为厌烦无休止的捣药逃到幻想乡而发生了许多事，所以才成为一名月之使者。难怪她会对地上表现出眷恋。不过她似乎也不喜欢月之使者的工作，感觉她从内到外都过得好辛苦啊…\n3. 一直活在后悔中是一种怎样的心情呢？如果时间可以重来，她就不会从捣药的工作中逃走了吗？那样她就会感到幸福吗？这些问题我都没能问出口…不过，与其徘徊在过去，还是向前看比较好吧？希望她有朝一日能得到真正的自由。\n\n## 顾客信息\n- **所属DLC**：5\n- **出没地区**：月之都\n- **预算**：200 ~ 350 円\n- **续单上限**：1\n- **喜好料理标签**：家常、山珍、海味、中华、甜、小巧、特产\n- **厌恶料理标签**：不可思议、昂贵\n- **喜好酒水标签**：高酒精、可加热、烧酒、啤酒、苦\n\n## 符卡效果\n- **「月免的篝火盛宴」**：召开一场盛大的篝火盛宴，场上每只存在的兔子生成一个随机食材或一瓶随机酒水，接下来30秒内出现新的兔子时会同样生成食材或酒水。生成食材的概率为80%，生成酒水的概率为20%。\n- **「酒醉迷乱」**：铃仙向场上打出一颗狂气之弹，影响场上的顾客，持续30秒。受到狂气影响的顾客食用不带有“高酒精”标签的酒水必定给出最低评价。当场上有伙伴【铃仙】时，此效果仅持续15秒。\n\n## 点餐对话\n- 今天也好累啊…\n- 忙碌的一天终于结束了！\n- 现在是犒赏自己的时间！\n- 肌肉好酸痛。\n\n## 评价对话\n- **极差评价**：真是糟糕的一天…\n- **差评**：今天也是就这样过去了吗…\n- **普通评价**：谢谢，我恢复力气了。\n- **好评**：谢谢老板娘治愈了我这一天的疲惫！\n- **极好评**：这就是我的光！！！\n- **钱不够（生气）**：就算把我卖了我也付不起呀！\n- **钱不够（普通）**：打工的钱快花完了…\n- **被驱赶时**：这就是属于我的命运吧。\n- **看到别人被驱赶**：这个世道到处都是不公的对待。"
    },

      "persona": "# 雪\n\n\n## 一设资料（THBWiki）\n\n## 角色信息\n\n- **人物名**：雪\n- **日文名**：ユキ\n- **英文名**：Yuki\n- **描述**：旧作角色。黑色魔女，魔界的一位魔法使\n\n## 生活状况\n\n（一设中无生活状况记载）\n\n## 简介\n\n旧作东方怪绮谈四面Boss之一，魔界的黑色魔女，与舞搭档登场。官方没有留下文字设定文档，一设中的外貌细节与更多人际关系均无记载，已知与舞共同担任四面Boss，个人主题曲为「绯红的少女 ～ Crimson Dead!!」。\n\n## 二创资料（东方夜雀食堂）\n\n## 人物介绍\n\n1. 在人类村子里摆摊贩卖食材的魔界人。名字虽然叫雪，但是修行的似乎却是火系魔法。平时经过人类村子的时候总能看见她不知疲倦的贩卖着囤积的各种食材，然后兑换成金币随身携带。\n2. 和雪相处下来，会发现她是一个乐观开朗、非常重视友谊的孩子，不过在天真无邪的同时也有一点冒失，有点像是和我一样的鸟脑袋呢！除此之外，原来她和舞是好朋友呀，怪不得总能看见她俩在一起摆摊呢！不过雪一个人摆摊的时候经常会算错价格，或许应该给她推荐一下人里最好的私塾寺子屋呢！\n3. 雪本人似乎没有察觉到，她身边的所有人都在默默关心帮助她。虽然有点担心雪的天真，但我相信只要有舞在她身后默默关心并保护着她，她肯定不会遇到危险的！身处在如此温暖的大家庭的照料之下，雪也在健康快乐地成长呢！\n\n## 顾客信息\n- **所属DLC**：9\n- **出没地区**：人间之里、魔界\n- **预算**：100 ~ 900 円\n- **续单上限**：1.4\n- **喜好料理标签**：肉、饱腹、鲜、甜、灼热、果味、辣、大份\n- **厌恶料理标签**：素、清淡、凉爽、小巧\n- **喜好酒水标签**：可加热、直饮、水果、甘、气泡、现代\n\n## 点餐对话\n- 神绮大人说了，没有卖完所有食材就不能和舞舞一起出去玩…\n- 舞舞她虽然话比较少，但每当我遇到困难的时候都会来帮我呢。\n- 虽然我学习的是火系魔法，但名字却叫雪呢。嘿嘿，是神绮大人给我取的名字哦！\n- 肚子饿得咕咕叫了，好想吃神绮大人做的苹果派！\n- 诶，经常吃霸王餐的小偷？误入幻想乡的外界人类？认错人了哦，我是魔界的魔法使雪哦！\n- 摆摊的时候卖了50块钱的食材，不小心给了100块钱的找零，结果被舞舞骂了一顿…\n\n## 评价对话\n- **极差评价**：唔姆…味道好奇怪的样子…明明是舞舞推荐的餐厅来着。\n- **差评**：似乎和神绮大人不用魔法的时候制作的炒菜味道很像呢！晚饭后回去还是加餐吃点薯片吧。\n- **普通评价**：这顿饭消耗掉了许多我囤积的食材呢！回去一定会被神绮大人夸奖的吧！\n- **好评**：真好吃，我一定要回去推荐舞舞也来尝一尝！一定不会忘记这件事的哦！\n- **极好评**：实在是太好吃啦！以后我每一顿饭都要来这里吃！啊咧，食材还没卖完…？\n- **钱不够（生气）**：不要！我已经没有金币给你了！\n- **钱不够（普通）**：我的金币不断地被抢走，这样的日子还能过下去吗！\n- **被驱赶时**：呜呜，老板娘，轮到我点单了吗？不要无视我啦！诶，这是要重新排队的意思吗？\n- **看到别人被驱赶**：为什么其他顾客都要重新排队？好哦，那我也去重新排队吧！"

      "persona": "# 雾雨魔理沙\n\n\n## 一设资料（THBWiki）\n\n## 角色信息\n\n- **人物名**：雾雨魔理沙\n- **日文名**：霧雨　魔理沙（きりさめ　まりさ）\n- **英文名**：Kirisame Marisa\n- **种族**：人类\n- **职业**：魔法使 1\n- **能力**：操纵魔法程度的能力 （红魔乡） 主要拥有使用魔法程度的能力 （妖妖梦） 使用魔法程度的能力 （萃梦想、永夜抄、花映塚、地灵殿、星莲船、神灵庙、辉针城、绀珠传、天空璋、鬼形兽、虹龙洞、锦上京、求闻史纪、人妖名鉴、幻存神签）\n- **描述**：新作角色。普通的魔法使，最爱偷窃书籍\n\n## 生活状况\n\n魔理沙经营着位于 魔法森林 内的“ 雾雨魔法店 ”，她的家雾雨邸就是店铺。不过， 稗田阿求 从没见过她工作的样子 。 要进入魔法森林并找到这家店十分困难。 她平日里埋头于魔法研究， 觉得研究魔法时没有其他人比较好 。 不研究魔法时她 喜欢热闹，过着自由的生活 ，经常出入 博丽神社 。尽管 经常出门 ，她却 自认为是个家里蹲 ， 博丽灵梦 也曾劝她多出出门 。 她比较怕冷。 她 有收集癖，且在年年加重 。 她经常 小偷小摸 。 她会使用 魔法扫帚 、 迷你八卦炉 、自制魔导书等等道具。 - 魔法扫帚是她自作主张地认为对于魔法使来说是必须的乘坐物。 - 迷你八卦炉是她最大的武器，同时也是她进行魔法实验和料理的必需品。 从在新作的首次登场开始，她就有了“だぜ”的口癖。\n\n## 简介\n\n系列第二主角，人类魔法使，在魔法森林经营\"雾雨魔法店\"。争强好胜不服输，稍有些乖僻、爱戏弄人，本性却很正直，容易亲近有人情味，平日埋头魔法研究，也喜欢热闹。金色卷发，一侧用蝴蝶结扎着麻花辫，头戴巨大的黑色三角巫师帽，黑色连衣裙配白色围裙。与灵梦私交甚密是神社常客，常去帕秋莉的图书馆\"借\"书被叫作\"老鼠\"，管霖之助叫\"香霖\"，已与家人断绝关系。\n\n## 二创资料（东方夜雀食堂）\n\n## 人物介绍\n\n1. 非常开朗健谈的人类魔法使，独自住在人烟罕至的魔法森林里修行，不管是人类、妖精还是妖怪都能轻松与之打成一片。对蘑菇似乎有很深刻的研究！\n2. 虽然看起来无所事事，其实也经营着一家“雾雨魔法店”。因为她喜欢收集却从不整理的性格，这家店常常被误以为是垃圾回收站。客人可想而知也是没有的。\n3. 虽然性格上有着心术不良的地方，但本性正直，和她一起的感觉很愉快！她从不愿让人看到她努力的样子，但我们都知道…这个自小就离家修行的小女孩，如果可以更多地依靠别人就好了。\n\n## 顾客信息\n- **所属DLC**：1\n- **出没地区**：魔法森林、妖怪兽道、人间之里、博丽神社、红魔馆、迷途竹林、妖怪之山、旧地狱、地灵殿、命莲寺、神灵庙、太阳花田、辉针城、月之都、魔界\n- **预算**：3000 ~ 5000 円\n- **续单上限**：1.1\n- **喜好料理标签**：传说、重油、和风、灼热、菌类、流行喜爱\n- **厌恶料理标签**：猎奇、流行厌恶\n- **喜好酒水标签**：低酒精、可加冰\n\n## 符卡效果\n- **流星「超级英仙座」**：随机获得三种菌类食材，偶然会出现高级货。\n- **魔符「拿来吧你」**：随机偷走两样东西，可能是料理、食材或酒水。且在偷完东西后，不付钱直接走人。\n\n## 点餐对话\n- 放心吧，我只是喜欢偷…借书，从来不吃霸王餐。\n- 可恶，今天又输给灵梦那个家伙了呀！\n- 偶尔像这样吃一顿也不错Da☆Ze！\n- 这么多人看着，我不会跑单的啦！\n- 魔法就是光和热，料理其实也差不多吧。\n\n## 评价对话\n- **极差评价**：这什么东西啊，还不如生吞蘑菇呢！\n- **差评**：一般般吧。\n- **普通评价**：味道不错诶，教教我怎么做呗。\n- **好评**：这个菜，感觉可以成为宴会的主角！\n- **极好评**：你是偷偷藏了什么魔法吗？居然会有这么好吃的料理！\n- **钱不够（生气）**：我去借点钱再来吃！\n- **钱不够（普通）**：账我已经付啦。你感觉箱子里的钱少了？不关我事哦。\n- **被驱赶时**：相信我！我这回真的带钱了！\n- **看到别人被驱赶**：这样不太友好啊。"
    },
    "霍青娥": {

      "persona": "# 霍青娥\n\n\n## 一设资料（THBWiki）\n\n## 角色信息\n\n- **人物名**：霍青娥\n- **日文名**：霍　青娥（かく　せいが）\n- **英文名**：Kaku Seiga\n- **别名**：青娥娘娘\n- **别名（日文）**：青娥　娘々（せいが　にゃんにゃん）\n- **别名（英文）**：Seiga NyanNyan\n- **种族**：邪仙\n- **能力**：穿越墙壁程度的能力 （神灵庙、求闻口授、人妖名鉴、幻存神签）\n\n## 生活状况\n\n青娥对穿墙的能力感到相当满足，因此对于其他仙术的修行并不热心。 她从很久以前开始便一直在暗中活动，并一直在躲避 地狱 鬼卒与 死神 的追捕，也正因如此她才不能抛头露面。 在 神灵骚动 前， 她待在地底 。在神灵骚动后，她从地底出来，生活在幻想乡中。 她总是会被强大人类的力量所吸引。 她在幻想乡里每天都到处晃荡嬉玩，看见感兴趣的人类和 妖怪 就会立即拉拢他们。\n\n## 简介\n\n活了一千年以上的邪仙，通称\"青娥娘娘\"，神灵庙四面Boss。性格非常邪恶，只要对自己有利，身边的人变成怎样都无所谓，因此被断绝了成为天人的可能；整日躲避地狱鬼卒与死神的追捕，看见感兴趣的人类和妖怪就立即拉拢。深蓝色卷发，把穿墙用的凿当簪子扎成双环，青蓝色连衣短裙披白色汗衫，身旁缠着白色羽衣。用防腐咒语把古尸做成宫古芳香并操纵她，曾劝丰聪耳神子表面信佛、暗信道。\n\n## 二创资料（东方夜雀食堂）\n\n## 人物介绍\n\n1. 经常见到她在神庙附近晃荡嬉玩的样子，似乎对修行不太热心…但又十分热衷于向别人传达修道的好处。实在搞不明白她到底在想什么。是个看起来很正统，行为和思想却很另类的仙人。\n2. 想要做成一件事就会不计后果地去达成，就算自己的行为不被人理解，她也会摆出一副理所当然的态度。要说她是被欲望驱使，又觉得恰恰相反…她所做的那些事，与其说是为了欲望，或许只是单纯的性格使然。\n3. 邪仙不一定就是邪恶的仙人。仅仅由于思考和行动都不够妥当就被断绝天人之路，确实是让我有些费解…我只知道青娥小姐非常有个性！如果成为天人就要泯灭个性，那我希望青娥小姐还是一直保持这个样子比较好。\n\n## 顾客信息\n- **所属DLC**：3\n- **出没地区**：神灵庙\n- **预算**：400 ~ 900 円\n- **续单上限**：1.4\n- **喜好料理标签**：素、传说、中华、甜、不可思议、小巧、特产、流行喜爱\n- **厌恶料理标签**：重油、饱腹\n- **喜好酒水标签**：低酒精、清酒、水果、现代\n\n## 符卡效果\n- **邪术「天下无墙」**：伙伴在食堂区域移动时可以穿过顾客或障碍物，持续30秒。\n- **入魔「走火入魔」**：稀有顾客每次结账，无论评价高低，都有30%的概率放一次惩罚符卡。如果是本来就会放惩罚符卡的情况，则多放一次。持续30秒。\n\n## 点餐对话\n- 小麻雀离烟火气有点太近了呢…\n- 我可爱的部下们受你关照了哟。\n- 四方食事，不过一碗人间烟火。\n- 想吃仙人的妖怪不少，给仙人做饭的还是第一次见呢。\n\n## 评价对话\n- **极差评价**：要不是走火入魔怎么可能会来吃这种东西！\n- **差评**：是我看走眼了吗？\n- **普通评价**：还要再加把劲哦。\n- **好评**：美食当前还嚷嚷着辟谷就太不解风情了。\n- **极好评**：努力活着才能吃到这样的美味呢。\n- **钱不够（生气）**：我像是身上有很重铜臭味的人吗？\n- **钱不够（普通）**：小麻雀也挺会宰客的呢。\n- **被驱赶时**：你可要想清楚哟…\n- **看到别人被驱赶**：是我看走眼了吗？"
    },

      "persona": "# 露易兹\n\n\n## 一设资料（THBWiki）\n\n## 角色信息\n\n- **人物名**：露易兹\n- **日文名**：ルイズ\n- **其他译名**：露易丝、路易丝\n- **罗马音**：Ruizu\n- **英文名**：Louise，Luize，Luise\n- **描述**：旧作角色。魔界人，想去人间界\n\n## 生活状况\n\n（一设中无生活状况记载）\n\n## 简介\n\n旧作东方怪绮谈二面Boss，想去人间界的魔界人。官方没有留下文字设定文档，一设中的外貌细节与人际关系均无记载，主题曲为「灵天 ～ Spiritual Heaven」。\n\n## 二创资料（东方夜雀食堂）\n\n## 人物介绍\n\n1. 经常偷偷溜出魔界甚至去外界旅行（工作）的魔界人，几乎随身带着一个可以自动行走的行李箱。工作内容是在一个叫做“博客”的地方分享自己的旅行过程，据说很受外面世界的人类欢迎。真奇怪，人类这么喜欢看别人旅行吗？\n2. 原来露易兹小姐不仅仅分享旅行过程，也经常分享自己的创意设计。她不仅见多识广，有非常多有趣的想法和创意，还很了解时尚，很会夸人，很会做甜品…真希望自己也能成为像露易兹小姐这样优秀的人呀。\n3. 就算像露易兹小姐这样满心满意地为了人类而行动的人，也一样无法得到所有人的认同。想要互相理解真不是一件容易的事啊。但就算这样，露易兹小姐也没有打算放弃热爱的工作。希望她的未来能够一直“不负热爱”。\n\n## 顾客信息\n- **所属DLC**：5\n- **出没地区**：魔界、妖怪兽道、人间之里、博丽神社、红魔馆、迷途竹林、魔法森林、妖怪之山、旧地狱、地灵殿、命莲寺、神灵庙、太阳花田、辉针城\n- **预算**：800 ~ 1000 円\n- **续单上限**：1\n- **喜好料理标签**：水产、西式、甜、适合拍照、小巧、特产、流行喜爱\n- **厌恶料理标签**：重油、饱腹\n- **喜好酒水标签**：中酒精、可加冰、鸡尾酒、啤酒、现代\n\n## 符卡效果\n- **「传奇的格列佛」**：露易兹召唤一架魔法相机停留在店内，如果稀有顾客本尊离开时未吃饱且预算未耗尽，则相机拍下该稀有顾客并转换为一份“旅者博客”。当日结束后“旅者博客”解放（如果拍摄时当日已结束，则立即解放），投影出其拍摄的顾客形象再次光临食堂，以此方式形成的稀有顾客的影像可以使用符卡，喜好和原先无异，但预算为其离开时的预算，续单上限为其离开时剩余的可点单数。\n- **「遗落的水晶鞋」**：当晚营业结束后，再经过60秒，将会强制驱逐店铺内的顾客并关店。\n\n## 点餐对话\n- 好想去人间界呀。\n- 其实人间界也有这样的店哦。\n- 偶尔就这样呆在魔界也挺好的。\n- 魔界难得有这么热闹的时候呢。\n\n## 评价对话\n- **极差评价**：这要是发到博客会被扔烂番茄。\n- **差评**：这种水平就算发到博客也没有人会关注。\n- **普通评价**：不温不火的水平呢。\n- **好评**：美味得我都想发博客了！\n- **极好评**：我一定要在博客上推荐这道料理！\n- **钱不够（生气）**：旅游景点的餐厅都没有你家贵！\n- **钱不够（普通）**：这好像高于一般定价了吧…\n- **被驱赶时**：赶客的景点是没有未来的…\n- **看到别人被驱赶**：再有名的景点也没有傲慢对待客人的资格。"
    },

      "persona": "# 露米娅\n\n\n## 一设资料（THBWiki）\n\n## 角色信息\n\n- **人物名**：露米娅\n- **日文名**：ルーミア\n- **英文名**：Rumia\n- **种族**：妖怪\n- **能力**：操纵黑暗程度的能力 （红魔乡、求闻史纪、人妖名鉴、幻存神签）\n- **描述**：新作角色。宵暗的妖怪，操纵黑暗的弱小妖怪\n\n## 生活状况\n\n露米娅一般行动时用黑暗包裹着自己，因此她看不见外界，外界也看不见她，常常因为这样而 自己撞到树上 。 她讨厌阳光，因为对阳光不适， 只要被阳光晒到了，皮肤就会觉得烧得慌，然后脑袋空空，最后还会发困 ；但月光就没有问题，因而在新月的夜晚常常能遇见没有展开黑暗的露米娅。\n\n## 简介\n\n宵暗的妖怪，红魔乡一面Boss，拥有操纵黑暗程度的能力。能力看似强大，实则在妖怪中属于弱者。平时用黑暗包裹自己行动，连她自己也看不见外界，常常因此撞到树上；讨厌阳光，新月之夜反而常不展开黑暗。年幼少女的外表，黄色及肩短发，赤瞳，头顶左侧系着一条连她自己都无法取下的红色灵符丝带，黑色外衣配红领带与黑色长裙，总是双手张开。一设中几乎没有固定人际关系。\n\n## 二创资料（东方夜雀食堂）\n\n## 人物介绍\n\n1. 喜欢黑暗的老友，总觉得她脑子空空的样子。但不得不说，和我很合得来。无论是第一点还是第二点。\n2. 这家伙总是到处漂荡，我从来都不知道她在做什么。一段时间没见，就能从她口中听到些新鲜的词汇…她到底是去哪了呢？\n3. 相识越久，越觉得自己对她的过去一无所知，就算问她，她也只会说不记得了。不过就算如此，我们也依然是好友，永远都会是好友。\n\n## 顾客信息\n- **所属DLC**：0\n- **出没地区**：妖怪兽道、魔法森林\n- **预算**：150 ~ 350 円\n- **续单上限**：1.4\n- **喜好料理标签**：肉、饱腹、生、招牌、猎奇、流行喜爱\n- **厌恶料理标签**：下酒、昂贵、流行厌恶\n- **喜好酒水标签**：苦、气泡\n\n## 符卡效果\n- **月符「月光射线」**：随机获得图鉴中记录的三种肉类食材（如果图鉴中记录的肉类食材只有两种，则获得两种）。\n- **暗符「境界线」**：在厨房放出黑雾，让你无法辨识哪些是厨具，哪些是食柜，黑雾持续20秒消失。\n\n## 点餐对话\n- “黑夜给了我们黑色的眼睛”，不就是为了让人寻找黑暗嘛。\n- 你看我像不像圣人被钉在十字架上？\n- 你这里太亮了，我的眼睛有点不舒服。\n- 最近有些人喊我三小姐，你知道这是为什么吗？\n- 为了来你这里就餐，我连身边的黑暗都减弱了。\n\n## 评价对话\n- **极差评价**：这就是所谓的黑暗料理吗？\n- **差评**：是——这样吗？\n- **普通评价**：挺好吃的哦。\n- **好评**：很好吃哦！\n- **极好评**：在你的料理下，感觉肉都会发光了！\n- **钱不够（生气）**：你的价格就像人类采用了十进制！\n- **钱不够（普通）**：就带了这么多啦…\n- **被驱赶时**：为什么不让我吃啦？\n- **看到别人被驱赶**：你也会像那样赶我走吗？"

      "persona": "# 风见幽香\n\n\n## 一设资料（THBWiki）\n\n## 角色信息\n\n- **人物名**：风见幽香\n- **日文名**：風見　幽香（かざみ　ゆうか）\n- **英文名**：Kazami Yuka\n- **种族**：妖怪\n- **能力**：操纵花朵程度的能力 （花映塚、求闻史纪、人妖名鉴、幻存神签）\n- **描述**：新作角色。四季的鲜花之主，十分强大与危险\n\n## 生活状况\n\n幽香生活在 太阳花田 ，会消灭一切闯入打扰的人类和妖怪。由于活得久，她 最近很少离开花田周围活动 。 她非常喜欢季节性开放的花朵，一年四季都生活在被自然的花包围的场所，以一年内所有时间都有花开放为目标而努力。 她 非常喜欢折磨人的精神 ，但作为强大的妖怪，对 同样拥有强大力量的妖怪或者拥有特别能力的人类 ”以外的人不感兴趣，并且 通常平时表现得很绅士 。\n\n## 简介\n\n十分强大与危险的妖怪，与其说是花之妖怪更像是自然的化身，旧作幻想乡登场、新作花映塚再登场。生活在太阳花田，会消灭一切闯入打扰的人类和妖怪；非常喜欢折磨人的精神，平时却表现得很绅士，只对强者感兴趣。绿色齐肩卷发，红瞳，白衬衫配红黄格子马甲与同纹及膝裙，戴黄色领巾，手持白色阳伞。一设中无固定人际关系。\n\n## 二创资料（东方夜雀食堂）\n\n## 人物介绍\n\n1. 虽然看起来是一副高雅的淑女形象，但不知道为什么，很多人将她视作“花之暴君”。虽然恐怖的传说满天飞，但大家其实都没有见过她欺负人类或者弱小妖怪。真实的她，究竟是一位怎样的人呢？\n2. 只要见过她照顾花儿的样子，那些有关她的谣言就会不攻自破。但我还是不明白，她有那么强大的妖力，为什么会容忍谣言满天飞，为什么要默默地承受那些恶意中伤呢？\n3. 大错特错！她从来都没有“忍受”过那些谣言，因为她根本就不在乎。于是连澄清都变得多此一举。幽香小姐最为强大之处，正是她的心。我想，并不是强大的妖力让她睥睨众人，真正让她立于不败之地的，是她纯粹又干净的自我。\n\n## 顾客信息\n- **所属DLC**：4\n- **出没地区**：太阳花田\n- **预算**：1200 ~ 1800 円\n- **续单上限**：1.3\n- **喜好料理标签**：高级、传说、清淡、西式、不可思议、梦幻、特产、流行喜爱\n- **厌恶料理标签**：饱腹、和风、咸、灼热\n- **喜好酒水标签**：鸡尾酒、西洋酒、利口酒、现代\n\n## 符卡效果\n- **「花鸟风月群芳沐」**：在场上种下一朵鲜花并利用能力使其生长，满心情时额外种下一朵，每朵生长的鲜花每24秒生产25小费。除幽香以外的稀有顾客释放奖励符卡时，随机一朵生长的鲜花将吸收符卡之力而盛放，吸引当地出没的稀有顾客造访食堂，被鲜花吸引来的稀有顾客会摘走这朵鲜花。鲜花盛放期间顾客用餐结束后额外提高15心情，15秒后鲜花凋谢，获得一层“落英缀裳”。{{br}}“落英缀裳”：可以抵挡一次中断Combo的失误。\n- **「决斗Spark!!!」**：用微笑的表情走到自己所在座位那一排的最上方，然后一发魔炮将这排桌子轰飞，当夜不可修复，并吓跑所有在这些位置用餐的顾客。\n\n## 点餐对话\n- 我对无聊的战斗不感兴趣。\n- 花儿们看起来也很高兴。\n- 这里从来没有过这样的氛围。\n- 花间有酒，独酌何碍。\n\n## 评价对话\n- **极差评价**：呵——！我接受你的挑衅——！\n- **差评**：如此相待，最随和的花儿也不会愿盛开。\n- **普通评价**：这样是无法获得花儿的青睐的。\n- **好评**：心情就像缓缓打开的花蕾一样呢。\n- **极好评**：你拥有的是让心花皆绽放的能力！\n- **钱不够（生气）**：我没有留下一记魔炮你就该感恩戴德了。\n- **钱不够（普通）**：漫天要价是无法延续生意的。"
    },
    "饕餮尤魔": {

      "category": "SpecialGuest",
      "persona": "# 饕餮尤魔\n\n\n## 一设资料（THBWiki）\n\n## 角色信息\n\n- **人物名**：饕 餮 尤魔\n- **日文名**：饕餮　尤魔（とうてつ　ゆうま）\n- **英文名**：Toutetsu Yuma，Toutetu Yuma\n- **种族**：饕餮\n- **能力**：什么都能吸收程度的能力 （刚欲异闻）\n- **描述**：新作角色。贪婪的刚欲同盟盟主，管理着旧血池地狱\n\n## 生活状况\n\n她是畜生界的组织：刚欲同盟的盟主 ，以自己的方式率领刚欲同盟与其他动物灵组织互相争斗，企图支配 畜生界 。 在 东方刚欲异闻 中，她盯上了 旧血池地狱 ，最终与 摩多罗隐岐奈 合作，成为了旧血池地狱的管理者。\n\n## 简介\n\n饕餮的动物灵，畜生界动物灵组织\"刚欲同盟\"的盟主，刚欲异闻正式登场。贪婪的大胃王，尤为擅长卑鄙狡诈的手段，拥有与外表不相符的智谋和冷静，信条是\"坐收渔利\"却总想亲力亲为。蓬松白发，红色卷曲双角系蓝蝴蝶结，山羊般的横方红瞳，蓝色连衣裙配红披肩，裸足，手持巨大的银色叉勺。与鬼杰组、劲牙组等组织敌对，与动物灵时期的八云蓝是旧识，后与摩多罗隐岐奈合作成为旧血池地狱的管理者。\n\n## 二创资料（东方夜雀食堂）\n\n## 人物介绍\n\n1. 畜生界什么同盟的盟主，传说中的饕餮的动物灵，是个什么都能吸收的不得了的大胃王！性格会受吞下的事物的影响，如今似乎有了对美食的追求，偶尔会到店里来做客…体型和模样都像个小孩子，希望不会被哪个不怕死的妖怪给小瞧了吧…\n\n## 顾客信息\n- **所属DLC**：1\n- **出没地区**：妖怪之山、妖怪兽道、博丽神社、红魔馆、魔法森林、迷途竹林、旧地狱、地灵殿、命莲寺、神灵庙、太阳花田、辉针城、月之都、魔界\n- **预算**：9999 ~ 9999 円\n- **续单上限**：1\n- **喜好料理标签**：肉、高级、传说、饱腹、鲜、生、力量涌现、不可思议、大份\n- **喜好酒水标签**：高酒精、烧酒、直饮、辛\n\n## 符卡效果\n- **「饕餮的饕餮之宴」**：除尤魔以外的顾客都只会点最贵的食物和酒水，且这些订单不消耗预算，持续30秒。\n- **「刚欲兽神饕餮的晚餐」**：暴走的尤魔将会随机吞噬掉3-5个食材和1-3个酒水，并吞噬1个厨具，使该厨具当晚无法使用。在血池地狱挑战中，会额外恢复5%的HP。\n\n## 点餐对话\n- 小看这人世可是会吃苦头的哦？\n- 血池的恐惧、悲欢、憎恶、怨恨也很美味呢。\n- 我的信条是“坐收渔利”。\n- 刚欲同盟的成员多半都是些各行其是的家伙。\n- 吃掉这个小麻雀的话，我是不是也能做出这么美味的食物。\n\n## 评价对话\n- **极差评价**：血池的恐惧、悲欢、憎恶、怨恨，你也想感受一下吗？！\n- **差评**：我不是为了这种东西跑到地上来的——！\n- **普通评价**：和黑水的味道差不多吧。\n- **好评**：一直以来小瞧地上了，这一趟来得值！\n- **极好评**：只有这种舌尖上的享受，才配得上我无限的胃袋！\n- **钱不够（生气）**：连我钱都想讹？先看看你有没有这个本事！\n- **钱不够（普通）**：这家饭店不讲理的程度和畜生界有得一拼。\n- **被驱赶时**：真以为我不会对你下手？\n- **看到别人被驱赶**：地上和畜生界也没什么不同，无趣。"
    },
    "鬼人正邪": {
      "displayName": "鬼人正邪",
      "category": "SpecialGuest",
      "persona": "# 鬼人正邪\n\n\n## 一设资料（THBWiki）\n\n## 角色信息\n\n- **人物名**：鬼人正邪\n- **日文名**：鬼人　正邪（きじん　せいじゃ）\n- **英文名**：Kijin Seija\n- **种族**：天邪鬼\n- **能力**：翻转一切程度的能力 （辉针城、人妖名鉴、幻存神签）\n- **描述**：新作角色。企图下克上的天邪鬼，想法总与其他人相反\n\n## 生活状况\n\n正邪一天到晚想着和别人相反的事情且绝对不服从命令，因而被妖怪、人类都讨厌，但是她反而为此高兴。\n\n## 简介\n\n性格扭曲的天邪鬼，辉针城五面Boss。为叛逆而叛逆，总想着和别人相反的事情，以与社会作对汲取乐趣，野心是把幻想乡翻转过来实现\"下克上\"，却从没考虑过未来。黑色翻翘短发带红白挑染，头生蓝灰小角，红瞳，缀满方向颠倒箭头的白色连衣裙，披红色披肩，后腰倒系蓝色蝴蝶结。为万宝槌欺骗利用了少名针妙丸，失败后两人仍结下孽缘；命中注定得不到可托全盘信赖的同伴。\n\n## 二创资料（东方夜雀食堂）\n\n## 人物介绍\n\n1. 擅长花言巧语的天邪鬼。打着要颠倒幻想乡的口号，蛊惑了许多年轻气盛的妖怪甚至人类来当手下，但却因为资金不足无法善待他们，甚至找天狗刊登广告骗游客来收取过路费…无论怎么看，都是个乱来的家伙。\n2. 正邪小姐真的想下克上吗？感觉她对造反成功之后的事情并没什么兴趣。或许她只是从和社会作对汲取乐趣，并不是真的想改变这个社会。\n3. 看着同伴一个接一个的离开，一般人多少都会觉得此路不通吧？但是正邪小姐完全没有想过放弃。在如今人人都悠闲地过着普通日子的幻想乡中，她是少有的不达目的绝不罢休的那一类。从某种程度来说，还蛮让我敬佩的…\n\n## 顾客信息\n- **所属DLC**：4\n- **出没地区**：辉针城\n- **预算**：300 ~ 600 円\n- **续单上限**：1.1\n- **喜好料理标签**：重油、下酒、灼热、力量涌现、猎奇、不可思议、燃起来了、流行厌恶\n- **厌恶料理标签**：高级、流行喜爱\n- **喜好酒水标签**：中酒精、烧酒、直饮、辛\n\n## 符卡效果\n- **欺符「超限效应」**：令全场除自身以外的顾客的厌恶标签反转为喜好标签，持续30秒。当场上包括排队顾客在内的普通顾客数量之和不少于7时，此符卡转化为“逆弓「天壤梦弓的诏敕」”。\n- **逆弓「天壤梦弓的诏敕」**：使场上包括排队顾客在内的普通顾客额外获得一次续单上限和25%预算，每位普通顾客最多可以受到此效果影响三次。\n- **逆转「颠倒世界」**：将自身的预算和全场最高预算水平的顾客预算翻转，并在接下来的15秒内持续将除自己以外的所有顾客的预算降低到全场最低预算顾客水平。\n\n## 点餐对话\n- 温温吞吞永远都无法革命成功。\n- 弱小的妖怪们，和我一起站起来吧！\n- 总有一天我会把你收入麾下。\n- 依恋“家的味道”也太软弱了！\n\n## 评价对话\n- **极差评价**：我要颠倒正是这种将糟糠奉为美食的世界！\n- **差评**：软弱的味道。\n- **普通评价**：“一般”颠倒过来还是“一般”。\n- **好评**：力量源源不绝！这就是美食的威力吗？\n- **极好评**：力量满满！此刻的我无论什么都能将其颠倒！\n- **钱不够（生气）**：小费就当做是你孝敬的保护费了！\n- **钱不够（普通）**：靠开食堂来敛财真是绝妙的主意啊。\n- **被驱赶时**：你以为这是谁的地盘？！\n- **看到别人被驱赶**：弱小妖怪什么时候才可以不被欺压？！"
    },
    "魂魄妖梦": {
      "displayName": "魂魄妖梦",
      "category": "SpecialGuest",
      "persona": "# 魂魄妖梦\n\n\n## 一设资料（THBWiki）\n\n## 角色信息\n\n- **人物名**：魂魄妖梦\n- **日文名**：魂魄　妖夢（こんぱく　ようむ）\n- **英文名**：Konpaku Youmu\n- **种族**：人类与幽灵的混血 （萃梦想、永夜抄、花映塚、绯想天、神灵庙、鬼形兽） 半人半灵 （人妖名鉴）\n- **职业**：园艺师\n- **能力**：使用剑术程度的能力 （妖妖梦、萃梦想、永夜抄、花映塚、神灵庙、鬼形兽、求闻史纪、人妖名鉴、幻存神签）\n- **描述**：新作角色。半人半灵的园艺师，脑子缺根筋的二刀流高手\n\n## 生活状况\n\n作为 白玉楼 的园艺师，妖梦大多数时间位于 冥界 ， 主要负责庭院的巡逻和修剪工作，早晚都会各巡视一次庭院，在这期间会对入侵者一律斩无赦。她有时也会外出购物 。 剑术尚不成熟的她，每日都会修行剑术。 因为 白玉楼的庭院十分广阔，并且栽种着大量的樱花 ，她 每日的工作十分繁重 。 她自称从生下来时就在为西行寺家服务，工作没有报酬和休假，只是在下午三点时有点心吃、生病的时候可以休息，并把这看做是理所当然的。 本来她还是幽幽子的剑术指导，但现在仅仅过着园艺师待遇的日子。 另外，由于幽幽子表现出的 吃货属性 ， 在 二次创作 中也常常有着妖梦作为白玉楼厨师负责幽幽子餐食的设定 。\n\n## 简介\n\n人类与幽灵混血的半人半灵，白玉楼的园艺师，兼任幽幽子的护卫与剑术指导，妖妖梦五面Boss。性格认真直率还不成熟，脑子有些缺根筋，因此经常被人戏弄；每日修行剑术，早晚巡视庭院，工作繁重却没有报酬和休假。银白色娃娃头短发戴黑丝带，青绿色短褂配短裙，手持楼观剑与白楼剑。主人幽幽子总把她耍来耍去，祖父魂魄妖忌是她的剑术老师，在她年幼时便已隐居。\n\n## 二创资料（东方夜雀食堂）\n\n## 人物介绍\n\n1. 侍奉着冥界之主的庭师兼侍卫、厨师。也就是说，她不仅要一个人照顾两百由旬的西行寺庭院，还要守卫西行寺家以及主人的安危，同时还要照顾大胃王主人的饮食需求！无论哪一个都是重担呢，希望她能在夜雀食堂得到一些治愈吧！\n\n## 顾客信息\n- **所属DLC**：0\n- **出没地区**：妖怪兽道、人间之里、博丽神社、迷途竹林\n- **预算**：300 ~ 400 円\n- **续单上限**：1.3\n- **喜好料理标签**：家常、清淡、鲜、力量涌现\n- **厌恶料理标签**：重油、咸、猎奇\n- **喜好酒水标签**：无酒精、可加热、水果\n\n## 符卡效果\n- **狱界剑「二百由旬之一闪」**：制作料理台的料理时能瞬间完成，持续60秒。\n- **天上剑「天人之五衰」**：顾客耐心衰减速度翻倍，且每2秒减少1点气氛，持续60秒。\n\n## 点餐对话\n- 终于可以轻松地来光顾了！\n- 之前太失礼了，老板娘能不计前嫌真是太好了。\n- 唉，侍奉幽幽子大人累得快让我的骨头散架了。\n- 老板娘如果有什么需要帮忙的，尽管开口！\n- 如果冥界也有一家食堂那我就轻松多了。\n\n## 评价对话\n- **极差评价**：就算是恶作剧也太过分了！\n- **差评**：诶——不应该是这个味道吧？\n- **普通评价**：我应该也可以做到这种程度吧？\n- **好评**：呜呜，我要是也能做出这个味道就好了！\n- **极好评**：啊——这就是我无论如何都无法实现出来的味道吗！\n- **钱不够（生气）**：爷爷说过，被敲诈的时候要掉头就走！\n- **钱不够（普通）**：对不起！我只能付得起这么多…\n- **被驱赶时**：为、为什么啊…\n- **看到别人被驱赶**：被赶走的人也太可怜了…"
    },

      "persona": "# 魅魔\n\n\n## 一设资料（THBWiki）\n\n## 角色信息\n\n- **人物名**：魅魔\n- **日文名**：魅魔（みま）\n- **英文名**：Mima\n- **描述**：旧作角色。恶灵小姐，博丽神社的作祟神\n\n## 生活状况\n\n（一设中无生活状况记载）\n\n## 简介\n\n旧作角色，曾对博丽神社怀有恨意的恶灵，灵异传与封魔录的Boss。当了很久恶灵后邪气尽除，如今把每天戏弄灵梦当作日常活动，已经是博丽神社的作祟神，性格比人类还像人类。绿色长发戴白色帽子（帽上有\"死\"字），蓝色披风配长裙，下身是一条尾巴而非双腿，后来的作品中手持顶端月牙形的手杖。与灵梦是旧作以来的冤家。\n\n## 二创资料（东方夜雀食堂）\n\n## 人物介绍\n\n1. 独自在魔界进行着（危险？）研究的…学者？自称是神灵，但被大家视为恶灵或邪灵。不管怎么样，能感受到她扎扎实实的强大和自信，她到底是怎样的存在呢？\n2. 魅魔小姐竟然诞生源自那个雾雨家的魔法实验，真是太让人惊讶了！不过，就算有着这样的渊源，信念坚定的魅魔小姐也绝不会受任何人所有或支配。追求和探索真理是魅魔小姐一生的目标，就算因此和雾雨家决裂、打了上百年的仗也不曾改变过本心。\n3. 原来魅魔小姐就是魔理沙小姐的师傅！我早就应该想到的，她们俩真的有很多共同点！无论是追求知识的执著和专注这点，还是道德感方面…以及，从来不会展现自己软弱和脆弱的一面…表面看起来完全不同的，这两个孤独又坚定的人，过去会是什么样子的呢？\n\n## 顾客信息\n- **所属DLC**：5\n- **出没地区**：魔界\n- **预算**：2000 ~ 3000 円\n- **续单上限**：1\n- **喜好料理标签**：水产、山珍、鲜、生、力量涌现、猎奇、菌类\n- **厌恶料理标签**：高级、清淡\n- **喜好酒水标签**：高酒精、可加冰、烧酒、西洋酒、辛\n\n## 符卡效果\n- **「幽冥的轮回」**：如果场上不存在“幽玄封魔阵”则生成法阵，如果存在则为法阵填充2点能量。{{br}}“幽玄封魔阵”：除魅魔以外的稀有顾客释放任意符卡时填充1点能量。能量达到7点时，消耗全部能量引发“梦符「时空一粟」”。\n- **梦符「时空一粟」**：场上所有就座的顾客的剩余预算回复到上限，制作料理不消耗食材且瞬间完成，顾客必定给出最高评价，持续20秒。\n- **「渎神的代价」**：受到“恶灵缠怨”：无法获得夜雀之歌类Buff，且无法触发特殊厨具效果，持续30秒。\n\n## 点餐对话\n- 这组实验数据还需要再验证…\n- 回过神来已经几天没吃饭了啊。\n- 稍微吃点再继续实验吧。\n- 等待的时间继续刚刚的计算吧。\n\n## 评价对话\n- **极差评价**：就像在知识宝库上轻浮蹦迪一般让人愤怒。\n- **差评**：就像外行人做内行事一般让人感到焦躁。\n- **普通评价**：就像胸无点墨的人炫耀自己的知识一般无聊。\n- **好评**：就像终于寻得了公式得出理想结果一般令人振奋！\n- **极好评**：就像邂逅了未解之谜一般令人陶醉！\n- **钱不够（生气）**：被小瞧了啊，忘记我的恐怖了吗——？\n- **钱不够（普通）**：略为小贵，无伤大雅。\n- **被驱赶时**：哦？竟这样对我，考虑清楚后果了吗？\n- **看到别人被驱赶**：最有效率的做法啊，脑子转的很快嘛。"

    "黑谷山女": {
      "displayName": "黑谷山女",
      "category": "SpecialGuest",
      "persona": "# 黑谷山女\n\n\n## 一设资料（THBWiki）\n\n## 角色信息\n\n- **人物名**：黑谷山女\n- **日文名**：黒谷　ヤマメ（くろだに　やまめ）\n- **英文名**：Kurodani Yamame\n- **种族**：土蜘蛛 （地灵殿） 妖怪 （人妖名鉴）\n- **能力**：操纵疾病（主要是传染病）程度的能力 （地灵殿、求闻口授、人妖名鉴） 操纵疾病程度的能力 （幻存神签）\n- **描述**：新作角色。操纵疾病的土蜘蛛，在地下人气很高还擅长建筑\n\n## 生活状况\n\n山女自称从出生起便被关在地下的 旧地狱 坐牢。 - 不过，她也曾 将自己的力量称为 被放逐到地下的妖怪的力量 。 - 一种调和这两个设定的解释是，土蜘蛛种群被放逐到了地下，而山女是在这之后才在地下出生的。 她栖息于 幻想风穴 内，活动于 旧都 和洞窟底层，也会到旧地狱其他地方与其他连接旧地狱和地面的通道（如 地灵虹洞 ）活动。 夜里她会在地上出没，会悄悄地出来地上接受土木作业委托。 她会私下挖通洞窟连接到地上，尽管这在旧地狱是重罪。\n\n## 简介\n\n土蜘蛛，地灵殿一面Boss。因能力被人类厌恶而生活在地下旧地狱，性格却开朗好战而有趣，在地下妖怪中很有人气；夜里会悄悄到地上接受土木作业的委托，还会私挖通往地上的洞窟。黄色短发，脑后用蝴蝶结扎着发髻，红褐色眼瞳，身穿形似蜘蛛腹部的褐色钟形背带连衣裙，内穿黑色长袖，裙上缠着黄色丝带。一设中无固定人际关系，荷取因她会污染河水而十分厌恶她。\n\n## 二创资料（东方夜雀食堂）\n\n## 人物介绍\n\n1. 在黑暗的风穴遇到的亲切的指路人。因为知道自己惹人讨厌所以几乎不会到村里去，明明那么可爱…真希望地上的大家也能认识她呢！\n2. 山女小姐原来是类似地底偶像一样的存在呢！不愧是她。不过，和她那可爱的性格相对的是，她的爱好似乎异于常人…\n3. 虽然一直被误会乃至成为“被厌恶者”，山女小姐也并不在意。我能感觉到，她确实深爱着这个地底世界。能有这样豁达的心境，真是了不起的境界啊。\n\n## 顾客信息\n- **所属DLC**：2\n- **出没地区**：旧地狱、妖怪兽道、红魔馆、魔法森林、妖怪之山\n- **预算**：250 ~ 400 円\n- **续单上限**：1.2\n- **喜好料理标签**：鲜、甜、生、适合拍照、猎奇、流行喜爱\n- **厌恶料理标签**：重油、咸、灼热\n- **喜好酒水标签**：低酒精、中酒精、啤酒、甘\n\n## 符卡效果\n- **「地下偶像狂欢夜」**：排队顾客会被偶像吸引，即使夜间营业结束也不会离去，持续30秒。\n- **细索「犍陀多绳索」**：移动速度下降80%，持续30秒。\n\n## 点餐对话\n- 被地上厌恶的地底世界，是我们的天堂。\n- 洞窟虽然是黑暗的，但是我的网很明亮哦。\n- 最近街道那边好热闹呀，偶尔去玩玩吧。\n- 只有抵住最黑的暗，才能收获最光的亮。\n\n## 评价对话\n- **极差评价**：还不如蛛网里的猎物好吃。\n- **差评**：我不是想打击你，但是味道确实不太好…\n- **普通评价**：传说中的夜雀食堂应该不止这种程度…\n- **好评**：氛围和食物都是满分哦。\n- **极好评**：能在黑暗的洞窟吃到这么美味的食物真是太棒了！\n- **钱不够（生气）**：这家店比黑蜘蛛还要黑！\n- **钱不够（普通）**：我还不太习惯地上的消费水平…\n- **被驱赶时**：就算我们什么都没做也会遭到厌恶吗？\n- **看到别人被驱赶**：瞧不起被厌恶者就别在这里开店了。"

      "persona": "# 鬼（普客）\n\n## 人物介绍\n\n远古时期就已经存在、传说中幻想乡最强的妖怪种族！但其实已经离开幻想乡很久了，没想到原来是盘踞在地底世界。鬼族性格爽朗但凶猛，绝对不能对他们说谎哦！\n\n## 顾客信息\n- **所属DLC**：2\n- **出没地区**：旧地狱\n- **喜好料理标签**：肉、高级、传说、下酒、鲜、力量涌现、特产、燃起来了、流行喜爱\n- **喜好酒水标签**：中酒精、高酒精、烧酒、直饮\n\n## 点餐对话\n- 能喝酒的地方越多越好。\n- 地上现在还有能够退治鬼的专家吗？\n- 这儿的热闹程度完全不亚于旧地狱街道上的酒馆啊。\n- 小麻雀，快把酒满上吧。"
    },
    "魔法使": {
      "displayName": "魔法使",
      "category": "NormalGuest",
      "persona": "# 魔法使（普客）\n\n## 人物介绍\n\n魔法森林里生长着许多有助于魔法使提高魔力的蘑菇，因此这里住着好多魔法使。她们大多独居，性格比较孤僻，大概魔法修行本身就是一件寂寞的事情吧。\n\n## 顾客信息\n- **所属DLC**：1\n- **出没地区**：魔法森林\n- **喜好料理标签**：素、家常、高级、传说、清淡、西式、鲜、适合拍照、凉爽、流行喜爱\n- **喜好酒水标签**：可加热、鸡尾酒、西洋酒、提神\n\n## 点餐对话\n- 魔法是一种超自然力，但归根结底，其本核还是科学。\n- 遇到认识但几乎没有来往的人的时候，上前打招呼真是需要勇气啊。\n- 进行魔法研究的时候必须全神贯注，为了不被打扰，魔法使几乎都是独居。\n- 修行魔法是很费钱的。如果我能早点学会舍食魔法，就能把吃饭的钱省下来研究魔法了。"
    },
    "鸦天狗": {
      "displayName": "鸦天狗",
      "category": "NormalGuest",
      "persona": "# 鸦天狗（普客）\n\n## 人物介绍\n\n谈吐虽然彬彬有礼，却又感觉有点儿强势。这是时常跑外勤的鸦天狗这一类天狗的通性，我实在有些不擅于应付。不过来者是客，我会努力照顾好的！\n\n## 顾客信息\n- **所属DLC**：0\n- **出没地区**：博丽神社、红魔馆、迷途竹林、妖怪之山\n- **喜好料理标签**：高级、招牌、适合拍照、菌类、流行喜爱\n- **喜好酒水标签**：烧酒、清酒\n\n## 点餐对话\n- 秋天的话，妖怪之山的枫叶会非常漂亮。\n- 虽然奇怪的传闻很多…但是我还是很尊重博丽的巫女大人的。\n- 我很喜欢拜访朋友的时候带一些手作食物，不过老板娘应该更擅长这个吧？见笑了。\n- 神秘的洋馆的传闻？你是说北边的那个，还是西边的那个呢？这可是幻想乡。\n- 只要好好去完成客人的要求，就不会被特地刁难。"
    }
  }
}
</script>
<script>
"use strict";

/* ================= 与 mod 侧保持一致的默认值（MystiaAI/src/Config/Settings.cs、Core/PersonaStore.cs） ================= */
const PROVIDER_PRESETS = {
  "DeepSeek": { baseUrl: "https://api.deepseek.com/v1",            model: "deepseek-v4-flash" },
  "OpenAI":   { baseUrl: "https://api.openai.com/v1",              model: "gpt-4o-mini" },
  "GLM":      { baseUrl: "https://open.bigmodel.cn/api/paas/v4",   model: "glm-4-flash" },
  "Moonshot": { baseUrl: "https://api.moonshot.cn/v1",             model: "moonshot-v1-8k" },
  "Claude":   { baseUrl: "https://api.anthropic.com/v1",           model: "claude-sonnet-4-5" },
  "Custom":   { baseUrl: "http://localhost:11434/v1",              model: "" },
};
const DEFAULT_BASE_URL = PROVIDER_PRESETS.DeepSeek.baseUrl;
const DEFAULT_MODEL = PROVIDER_PRESETS.DeepSeek.model;
const PLACEHOLDER = "【待填写】";

const CATEGORY_NAMES = {
  "Default": "全局兜底", "DayNpc": "路边居民",
  "NormalGuest": "普通客人", "SpecialGuest": "稀客",
};

function defaultSettings() {
  return {
    "_meta": { "tool": "MystiaAI", "kind": "settings", "version": "1" },
    "enabled": true, "normalGuestAiEnabled": true,
    "provider": "DeepSeek", "apiKey": "",
    "baseUrl": DEFAULT_BASE_URL, "model": DEFAULT_MODEL,
    "maxLength": 50, "streaming": false, "timeoutSeconds": 10,
  };
}

function defaultPersonas() {
  return JSON.parse(document.getElementById("builtinPersonasData").textContent);
}

/* ================= 状态（两个文件并行编辑） ================= */
const settingsState = { data: null, dirty: false, created: false };
const personasState = { data: null, dirty: false, created: false };
let dirHandle = null;   // FileSystemDirectoryHandle（无目录写权限的浏览器为 null，保存退化为下载）
let dirName = "";
let selectedKey = null; // 角色设定页当前选中（"cat:Default" 或 "char:Rumia"）

const $ = id => document.getElementById(id);
const statusEl = $("status");
function setStatus(msg, cls) { statusEl.textContent = msg; statusEl.className = cls || ""; }
function anyDirty() { return settingsState.dirty || personasState.dirty; }
function refreshSaveBtn() { $("btnSave").disabled = !anyDirty(); }
function markDirty(st) { st.dirty = true; refreshSaveBtn(); }

/* ================= 文件识别 / 解析 ================= */
function detectKind(obj) {
  if (obj && obj._meta && obj._meta.tool === "MystiaAI") {
    if (obj._meta.kind === "settings") return "settings";
    if (obj._meta.kind === "personas") return "personas";
    return null;
  }
  // v1 扁平人设文件（无 _meta 的纯字符串字典）自动升级
  if (obj && !Array.isArray(obj) && typeof obj === "object") {
    const vals = Object.values(obj);
    if (vals.length > 0 && vals.every(v => typeof v === "string")) return "personas-v1";
  }
  return null;
}

// 返回 true=识别并载入，false=失败（errOut.msg 输出原因）
function loadSettingsText(text, errOut) {
  let obj;
  try { obj = JSON.parse(text); } catch { errOut.msg = "不是有效的 JSON"; return false; }
  if (detectKind(obj) !== "settings") { errOut.msg = "不是 MystiaAI 的 settings 文件"; return false; }
  settingsState.data = obj; settingsState.dirty = false; settingsState.created = false;
  return true;
}

function loadPersonasText(text, errOut) {
  let obj;
  try { obj = JSON.parse(text); } catch { errOut.msg = "不是有效的 JSON"; return false; }
  const kind = detectKind(obj);
  if (kind === "personas-v1") {
    // 升级为 v2 结构
    const upgraded = defaultPersonas();
    for (const [k, v] of Object.entries(obj)) {
      if (k === "Default") upgraded.categories.Default = v;
      else upgraded.characters[k] = { displayName: k, category: "SpecialGuest", persona: v };
    }
    personasState.data = upgraded; personasState.dirty = true; personasState.created = false;
    errOut.upgraded = true;
    return true;
  }
  if (kind !== "personas") { errOut.msg = "不是 MystiaAI 的 personas 文件"; return false; }
  personasState.data = obj; personasState.dirty = false; personasState.created = false;
  return true;
}

/* ================= 打开文件夹 ================= */
async function openFolder() {
  try {
    if (window.showDirectoryPicker) {
      const dir = await window.showDirectoryPicker({ id: "mystiaai-cfg" });
      dirHandle = dir; dirName = dir.name;
      await readFromDirectory(async name => {
        const h = await dir.getFileHandle(name);
        return (await h.getFile()).text();
      });
    } else {
      $("folderInput").value = "";
      $("folderInput").click(); // webkitdirectory 兜底（只读，保存时下载）
    }
  } catch (e) {
    if (e && e.name !== "AbortError") setStatus("打开失败：" + e.message, "err");
  }
}

// readFile(name) → Promise<text>，文件不存在时抛 NotFoundError
async function readFromDirectory(readFile) {
  settingsState.data = null; personasState.data = null;
  let found = 0; const notes = []; const errors = [];

  // settings.json
  {
    const errOut = {};
    try {
      const text = await readFile("settings.json");
      if (loadSettingsText(text, errOut)) found++;
      else errors.push("settings.json：" + errOut.msg);
    } catch (e) {
      if (e && e.name === "NotFoundError") {
        settingsState.data = defaultSettings();
        settingsState.dirty = true; settingsState.created = true;
        notes.push("settings.json 不存在，已按默认新建（保存时写入）");
      } else errors.push("settings.json 读取失败：" + e.message);
    }
  }
  // personas.json
  {
    const errOut = {};
    try {
      const text = await readFile("personas.json");
      if (loadPersonasText(text, errOut)) {
        found++;
        if (errOut.upgraded) notes.push("personas.json 已从 v1 旧格式自动升级（保存后生效）");
      } else errors.push("personas.json：" + errOut.msg);
    } catch (e) {
      if (e && e.name === "NotFoundError") {
        personasState.data = defaultPersonas();
        personasState.dirty = true; personasState.created = true;
        notes.push("personas.json 不存在，已按默认新建（保存时写入）");
      } else errors.push("personas.json 读取失败：" + e.message);
    }
  }

  if (found === 0 && !settingsState.created && !personasState.created) {
    // 两个文件都读到了但都不认 → 选错文件夹
    dirHandle = null;
    setStatus("所选文件夹不是 MystiaAI 配置文件夹（" + errors.join("；") + "）", "err");
    return;
  }
  if (found === 0 && settingsState.created && personasState.created) {
    // 两个文件都不存在 → 可能是选错文件夹，提示但允许当作新建
    setStatus(`文件夹「${dirName}」中没有配置文件，已载入默认值；确认无误后点「保存修改」即在此新建`, "ok");
  } else if (errors.length) {
    setStatus(`已部分加载「${dirName}」（${errors.join("；")}）`, "err");
  } else {
    setStatus(`已加载文件夹：${dirName}${notes.length ? "（" + notes.join("；") + "）" : ""}`, "ok");
  }
  afterLoad();
}

function afterLoad() {
  if (settingsState.data) fillSettingsForm();
  if (personasState.data) { normalizePersonas(); renderCharTree(); selectKey("cat:Default"); }
  refreshSaveBtn();
}

// webkitdirectory 兜底（Firefox/Safari）：读取，保存时下载
$("folderInput").addEventListener("change", async () => {
  const files = Array.from($("folderInput").files || []);
  if (!files.length) return;
  dirHandle = null;
  dirName = (files[0].webkitRelativePath || "").split("/")[0] || "所选文件夹";
  const byName = {};
  for (const f of files) byName[f.name] = f;
  await readFromDirectory(async name => {
    const f = byName[name];
    if (!f) { const e = new Error("not found"); e.name = "NotFoundError"; throw e; }
    return f.text();
  });
});

/* ================= 保存 ================= */
async function writeToDir(name, text) {
  if ((await dirHandle.requestPermission({ mode: "readwrite" })) !== "granted")
    throw new Error("没有文件夹写入权限");
  const h = await dirHandle.getFileHandle(name, { create: true });
  const w = await h.createWritable();
  await w.write(text); await w.close();
}

function downloadText(name, text) {
  const blob = new Blob([text], { type: "application/json" });
  const a = document.createElement("a");
  a.href = URL.createObjectURL(blob);
  a.download = name;
  a.click(); URL.revokeObjectURL(a.href);
}

async function saveAll() {
  collectSettingsForm();
  collectPersonaEditor();
  const jobs = [];
  if (settingsState.data && settingsState.dirty)
    jobs.push(["settings.json", JSON.stringify(settingsState.data, null, 2), settingsState]);
  if (personasState.data && personasState.dirty)
    jobs.push(["personas.json", JSON.stringify(personasState.data, null, 2), personasState]);
  if (!jobs.length) { setStatus("没有需要保存的修改", ""); return; }
  try {
    for (const [name, text, st] of jobs) {
      if (dirHandle) await writeToDir(name, text);
      else downloadText(name, text);
      st.dirty = false; st.created = false;
    }
    refreshSaveBtn();
    const names = jobs.map(j => j[0]).join("、");
    setStatus(dirHandle
      ? `已保存 ${names} 到「${dirName}」（游戏内 2 秒内自动生效）`
      : `已下载 ${names}，请手动覆盖到 文档\\MystiaAI\\`, "ok");
  } catch (e) {
    setStatus("保存失败：" + e.message, "err");
  }
}

/* ================= 新建默认配置 ================= */
async function newConfig() {
  try {
    if (window.showDirectoryPicker) {
      dirHandle = await window.showDirectoryPicker({ id: "mystiaai-cfg" });
      dirName = dirHandle.name;
    } else {
      dirHandle = null; dirName = "（下载后请放入 文档\\MystiaAI\\）";
    }
  } catch (e) {
    if (e && e.name === "AbortError") return;
    setStatus("选择文件夹失败：" + e.message, "err"); return;
  }
  settingsState.data = defaultSettings();
  settingsState.dirty = true; settingsState.created = true;
  personasState.data = defaultPersonas();
  personasState.dirty = true; personasState.created = true;
  afterLoad();
  setStatus(`已创建默认配置（目标：${dirName}），点「保存修改」写入`, "ok");
}

/* ================= 通用设置页 ================= */
function fillSettingsForm() {
  const d = settingsState.data;
  if (!d) return;
  $("s_enabled").checked = d.enabled !== false;
  $("s_normalGuest").checked = d.normalGuestAiEnabled !== false;
  $("s_provider").value = d.provider || "DeepSeek";
  $("s_apiKey").value = d.apiKey || "";
  $("s_baseUrl").value = d.baseUrl || "";
  $("s_model").value = d.model || "";
  $("s_maxLength").value = d.maxLength ?? 50;
  $("s_timeout").value = d.timeoutSeconds ?? 10;
  $("s_streaming").checked = d.streaming === true;
}

function collectSettingsForm() {
  if (!settingsState.data) return;
  Object.assign(settingsState.data, {
    enabled: $("s_enabled").checked,
    normalGuestAiEnabled: $("s_normalGuest").checked,
    provider: $("s_provider").value,
    apiKey: $("s_apiKey").value.trim(),
    baseUrl: $("s_baseUrl").value.trim(),
    model: $("s_model").value.trim(),
    maxLength: parseInt($("s_maxLength").value, 10) || 50,
    timeoutSeconds: parseFloat($("s_timeout").value) || 10,
    streaming: $("s_streaming").checked,
  });
  settingsState.data._meta = { tool: "MystiaAI", kind: "settings", version: "1" };
}

$("s_provider").addEventListener("change", () => {
  const p = PROVIDER_PRESETS[$("s_provider").value];
  if (!p) return;
  // 只覆盖仍是默认值的字段（尊重用户已自定义的内容），Custom 也给出本地示例
  if ($("s_baseUrl").value === "" || $("s_baseUrl").value === DEFAULT_BASE_URL ||
      Object.values(PROVIDER_PRESETS).some(x => x.baseUrl === $("s_baseUrl").value)) {
    $("s_baseUrl").value = p.baseUrl;
  }
  if ($("s_model").value === "" || $("s_model").value === DEFAULT_MODEL ||
      Object.values(PROVIDER_PRESETS).some(x => x.model === $("s_model").value)) {
    $("s_model").value = p.model;
  }
  markDirty(settingsState);
});
for (const id of ["s_enabled","s_normalGuest","s_apiKey","s_baseUrl","s_model","s_maxLength","s_timeout","s_streaming"])
  $(id).addEventListener("change", () => markDirty(settingsState));

/* ================= 角色设定页 ================= */
function normalizePersonas() {
  const d = personasState.data;
  d.categories = d.categories || {};
  d.characters = d.characters || {};
  const defs = defaultPersonas().categories;
  for (const k of Object.keys(defs)) if (!(k in d.categories)) d.categories[k] = defs[k];
}

function isUnfilled(p) { return !p || !p.trim() || p.trimStart().startsWith(PLACEHOLDER); }

function renderCharTree() {
  if (!personasState.data) return;
  const kw = $("searchBox").value.trim().toLowerCase();
  const tree = $("charTree"); tree.innerHTML = "";
  const mkGroup = (title, items) => {
    if (!items.length) return;
    const g = document.createElement("div"); g.className = "group";
    g.innerHTML = `<div class="group-title">${title}</div>`;
    for (const it of items) g.appendChild(it);
    tree.appendChild(g);
  };
  const mkItem = (id, label, unfilled) => {
    const d = document.createElement("div");
    d.className = "char-item" + (selectedKey === id ? " active" : "");
    d.textContent = label;
    if (unfilled) {
      const s = document.createElement("span");
      s.className = "unfilled"; s.textContent = "(未填写)"; d.appendChild(s);
    }
    d.onclick = () => selectKey(id);
    return d;
  };
  // 通用分类
  mkGroup("通用", Object.keys(CATEGORY_NAMES)
    .filter(k => !kw || CATEGORY_NAMES[k].includes(kw))
    .map(k => mkItem("cat:" + k, CATEGORY_NAMES[k], isUnfilled(personasState.data.categories[k]))));
  // 角色按分类分组
  const byCat = { "SpecialGuest": [], "DayNpc": [], "NormalGuest": [], "其他": [] };
  for (const [key, e] of Object.entries(personasState.data.characters)) {
    const name = e.displayName || key;
    if (kw && !name.toLowerCase().includes(kw) && !key.toLowerCase().includes(kw)) continue;
    (byCat[e.category] || byCat["其他"]).push(mkItem("char:" + key, `${name}（${key}）`, isUnfilled(e.persona)));
  }
  mkGroup("稀客", byCat.SpecialGuest);
  mkGroup("路边居民", byCat.DayNpc);
  mkGroup("普通客人", byCat.NormalGuest);
  mkGroup("其他", byCat["其他"]);
}

function selectKey(id) {
  collectPersonaEditor(); // 先收编当前编辑内容
  selectedKey = id;
  renderCharTree();
  const isCat = id.startsWith("cat:");
  const key = id.slice(id.indexOf(":") + 1);
  $("c_key").value = key;
  $("btnDeleteChar").disabled = isCat;
  $("btnResetChar").disabled = false;
  if (isCat) {
    $("c_displayName").value = CATEGORY_NAMES[key] || key;
    $("c_displayName").disabled = true;
    $("c_category").disabled = true;
    $("c_persona").value = (personasState.data.categories || {})[key] || "";
  } else {
    const e = personasState.data.characters[key] || { displayName: key, category: "SpecialGuest", persona: "" };
    $("c_displayName").value = e.displayName || key;
    $("c_displayName").disabled = false;
    $("c_category").value = e.category || "SpecialGuest";
    $("c_category").disabled = false;
    $("c_persona").value = e.persona || "";
  }
  updateCharState();
}

function updateCharState() {
  const unfilled = isUnfilled($("c_persona").value);
  $("c_state").textContent = unfilled ? "⚠ 该条目尚未填写人设，运行时会向上回退（分类 → 全局兜底）" : "";
}

function collectPersonaEditor() {
  if (!selectedKey || !personasState.data) return;
  const isCat = selectedKey.startsWith("cat:");
  const key = selectedKey.slice(selectedKey.indexOf(":") + 1);
  if (isCat) {
    personasState.data.categories[key] = $("c_persona").value;
  } else if (personasState.data.characters[key]) {
    personasState.data.characters[key].displayName = $("c_displayName").value.trim() || key;
    personasState.data.characters[key].category = $("c_category").value;
    personasState.data.characters[key].persona = $("c_persona").value;
  }
}

$("c_persona").addEventListener("input", () => { if (personasState.data) { markDirty(personasState); updateCharState(); } });
$("c_displayName").addEventListener("change", () => { collectPersonaEditor(); markDirty(personasState); renderCharTree(); });
$("c_category").addEventListener("change", () => { collectPersonaEditor(); markDirty(personasState); renderCharTree(); });
$("searchBox").addEventListener("input", renderCharTree);

$("btnAddChar").addEventListener("click", () => {
  if (!personasState.data) return;
  const key = prompt("角色内部名（英文，如 Rumia）：");
  if (!key || !/^[A-Za-z0-9_]+$/.test(key)) { if (key !== null) alert("内部名只能是英文/数字/下划线"); return; }
  if (personasState.data.characters[key]) { alert("该内部名已存在"); return; }
  personasState.data.characters[key] = { displayName: key, category: "NormalGuest", persona: PLACEHOLDER };
  markDirty(personasState); renderCharTree(); selectKey("char:" + key);
});

$("btnDeleteChar").addEventListener("click", () => {
  if (!selectedKey || selectedKey.startsWith("cat:") || !personasState.data) return;
  const key = selectedKey.slice(selectedKey.indexOf(":") + 1);
  if (!confirm(`删除角色条目「${key}」？`)) return;
  delete personasState.data.characters[key];
  markDirty(personasState); selectedKey = null; renderCharTree(); selectKey("cat:Default");
});

$("btnResetChar").addEventListener("click", () => {
  if (!selectedKey) return;
  const defs = defaultPersonas();
  if (selectedKey.startsWith("cat:")) {
    const k = selectedKey.slice(selectedKey.indexOf(":") + 1);
    if (defs.categories[k]) $("c_persona").value = defs.categories[k];
  } else {
    const k = selectedKey.slice(selectedKey.indexOf(":") + 1);
    if (defs.characters[k]) $("c_persona").value = defs.characters[k].persona;
    else $("c_persona").value = PLACEHOLDER;
  }
  markDirty(personasState); updateCharState();
});

/* ================= 页签 ================= */
function switchTab(pageId) {
  for (const t of document.querySelectorAll("nav .tab"))
    t.classList.toggle("active", t.dataset.page === pageId);
  $("settingsPage").style.display = pageId === "settingsPage" ? "" : "none";
  $("personaPage").style.display = pageId === "personaPage" ? "flex" : "none";
}
for (const t of document.querySelectorAll("nav .tab"))
  t.addEventListener("click", () => {
    if (t.dataset.page === "personaPage") collectSettingsForm();
    switchTab(t.dataset.page);
  });

$("btnOpen").addEventListener("click", openFolder);
$("btnSave").addEventListener("click", saveAll);
$("btnNew").addEventListener("click", newConfig);

window.addEventListener("beforeunload", e => { if (anyDirty()) { e.preventDefault(); e.returnValue = ""; } });
</script>
</body>
</html>
